# Builds the UnDash image (tests run inside the build) and pushes it to ghcr.io/stiphr/undash.
# Runs only when you ask for it (Actions > Docker image > Run workflow) or when you push a version tag (v2026.10.30).
# A build from the beta branch is published as :beta only and never replaces :latest. Its number is set by hand below.
name: Docker image
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: v
        run: |
          if [ "$GITHUB_REF_NAME" = beta ]; then
            echo "version=1.0.0rc" >> "$GITHUB_OUTPUT"
            echo "tag=beta" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: |
            ${{ !contains(github.ref_name, 'beta') && 'ghcr.io/stiphr/undash:latest' || '' }}
            ghcr.io/stiphr/undash:${{ steps.v.outputs.tag }}
