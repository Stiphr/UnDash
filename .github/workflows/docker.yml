# Builds the UnDash image (tests run inside the build) and pushes it to ghcr.io/stiphr/undash.
# Runs only when you ask for it (Actions > Docker image > Run workflow) or when you push a version tag (v2026.10.30).
name: Docker image
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: |
            ghcr.io/stiphr/undash:latest
            ghcr.io/stiphr/undash:${{ steps.v.outputs.version }}
