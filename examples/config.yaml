# UnDash example settings: 7 groups, 31 apps, every section, Default theme.
# Import it in Settings > Backup & import, then change the addresses to yours (192.168.1.10 is a placeholder)
# and add each app's API key or login in Settings > Apps. No keys, passwords or user names are in this file.
version: 5
general:
  title: UnDash
  refresh_services: 15
  disk_path: /mnt/user
  search: duckduckgo
  show_search: true
  show_date: true
  os_check_hours: 6
  ups_name: ups
  refresh: 2
  background_poll: slow
appearance:
  theme: default
  background: ""
  blur: 15
  brightness: 35
  accent: ""
  density: comfortable
  css_enabled: true
  mode: dark
  blur_target: cards
  safe_x: -1
  safe_y: -1
dashboard:
  sections:
    - id: overview
      visible: true
      width: full
      collapsed: false
    - id: alerts
      visible: true
      width: full
      collapsed: false
    - id: favorites
      visible: false
      width: full
      collapsed: false
    - id: media
      visible: true
      width: half
      collapsed: false
    - id: arr
      visible: true
      width: half
      collapsed: false
    - id: downloads
      visible: true
      width: half
      collapsed: false
    - id: playing
      visible: true
      width: half
      collapsed: false
    - id: requests
      visible: true
      width: half
      collapsed: true
    - id: apps
      visible: true
      width: full
      collapsed: false
    - id: docker
      visible: true
      width: full
      collapsed: false
    - id: vms
      visible: true
      width: full
      collapsed: false
    - id: health
      visible: true
      width: full
      collapsed: true
  metrics:
    - id: cpu
      visible: true
    - id: memory
      visible: true
    - id: storage
      visible: true
    - id: network
      visible: true
    - id: health
      visible: true
    - id: disks
      visible: true
    - id: uptime
      visible: true
    - id: ups
      visible: true
    - id: cores
      visible: false
    - id: swap
      visible: false
    - id: load
      visible: false
    - id: path
      visible: false
    - id: docker
      visible: false
    - id: vms
      visible: false
media:
  radarr: ""
  sonarr: ""
  count: 10
  days_ahead: 30
  widgets:
    - id: upcoming_movies
      visible: true
      count: 10
    - id: upcoming_episodes
      visible: true
      count: 10
    - id: recent_movies
      visible: true
      count: 10
    - id: recent_episodes
      visible: true
      count: 10
downloads:
  items: 4
apps:
  columns: 0
  links: false
  headers: false
docker:
  layout: grid
  view: compact
  filter: running
  selected: []
  columns: 0
  sort: name
  show:
    - cpu
    - memory
    - update
  hide_stopped: false
  items: []
vms:
  layout: list
  show:
    - status
    - cpus
    - memory
  items: []
